name: Foundation checks
on:
  pull_request:
  push:
    branches: [main, 'foundation/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
        env:
          POSTGRES_USER: assessment_owner
          POSTGRES_PASSWORD: local_owner_only
          POSTGRES_DB: assessment
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U assessment_owner -d assessment"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql://assessment_app:local_app_only@127.0.0.1:5432/assessment
      MIGRATION_DATABASE_URL: postgresql://assessment_owner:local_owner_only@127.0.0.1:5432/assessment
      WEB_ORIGIN: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: node scripts/init-env.mjs
      - run: npm ci --ignore-scripts
      - run: npm run generate
      - name: Initialize restricted application role
        env:
          PGPASSWORD: local_owner_only
        run: psql -h 127.0.0.1 -U assessment_owner -d assessment -v ON_ERROR_STOP=1 -f scripts/db-init.sql
      - run: npm run db:migrate && npm run db:migrate
      - run: npm run check
      - run: npx playwright install-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: npm run test:e2e
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
          retention-days: 3
